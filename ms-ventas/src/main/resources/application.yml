server:
  port: ${PORT:8083}
spring:
  application:
    name: ms-ventas
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
    username: ${DB_USERNAME:C##ms_ventas}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
jwt:
  secret: ${JWT_SECRET}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

servicios:
  identidad: ${IDENTIDAD_URL:http://localhost:8081}
  catalogo: ${CATALOGO_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default:
  connectTimeout: 3000
  readTimeout: 5000
